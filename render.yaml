services:
  - type: web
    name: regintelx-backend
    runtime: python
    rootDir: backend
    buildCommand: |
      apt-get update &&
      apt-get install -y tesseract-ocr poppler-utils &&
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
